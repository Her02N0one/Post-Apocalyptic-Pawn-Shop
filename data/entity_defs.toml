# Entity Definitions — rendering & editor placement properties.
#
# Each entry defines a placeable entity type.  Only visual/placement
# data lives here; gameplay logic (ECS components, AI, etc.) is
# separate and resolved at runtime.
#
# Fields:
#   display_name  — Human-readable label
#   category      — Grouping for the editor palette
#   color         — [R, G, B] flat-colour fallback (0-255)
#   scale         — Height in world units (also drives billboard size)
#   directional   — Whether the entity has facing-dependent visuals
#   states        — Visual state keys (texture/animation variants)

[barrel]
display_name = "Barrel"
category     = "props"
color        = [120, 90, 60]
scale        = 0.5
directional  = false
states       = ["default", "exploded"]

