# Population presets -- entity spawning rules for rooms and zones.
# Works like loot tables: each preset has pools of weighted entries.
# Rolls determine how many picks from each pool; entries have weight
# and min/max count per pick.
#
# Used by BSP generation, zone templates, and the "Populate" action.

[presets.bedroom]
description = "Sleeping quarters furnishings"
tags = ["residential", "bedroom"]

[[presets.bedroom.pools]]
name = "furniture"
rolls = 2
bonus_rolls = 1

[[presets.bedroom.pools.entries]]
prefab = "table"
weight = 10
min_count = 1
max_count = 1

[[presets.bedroom.pools.entries]]
prefab = "chair"
weight = 6
min_count = 0
max_count = 1

[[presets.bedroom.pools.entries]]
prefab = "shelf"
weight = 4
min_count = 0
max_count = 1

[[presets.bedroom.pools]]
name = "lighting"
rolls = 1
bonus_rolls = 0

[[presets.bedroom.pools.entries]]
