# Segmented Brick — Wall with two distinct texture bands.
# Lower half uses stone, upper half uses brick.  Demonstrates
# how presets can encode wall segments for repeatable patterns.

name = "Segmented Brick"
category = "Walls"
color = [150, 90, 65]

# floor_height: 0.0–10.0 (at 10.0 the cell becomes a solid column)
floor_height = 1.0
ceil_height = 1.0
wall_texture = "brick_wall"

# wall_segments: [north_segs, south_segs, east_segs, west_segs]
# Each face: [[texture, y_top], ...]  (bottom to top)
wall_segments = [[["stone", 0.5], ["brick_wall", 1.0]], [["stone", 0.5], ["brick_wall", 1.0]], [["stone", 0.5], ["brick_wall", 1.0]], [["stone", 0.5], ["brick_wall", 1.0]]]
