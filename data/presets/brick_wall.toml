# Brick Wall — Full-height solid column with brick textures.
# The cell becomes an opaque, impassable block rendered with
# four vertical brick faces.  Nothing can see or walk through it.

name = "Brick Wall"
category = "Walls"
color = [140, 80, 60]

# apply_mode: "replace" | "stack_floor" | "stack_ceil" | "merge"
apply_mode = "replace"

# floor_height: 0.0–10.0 (at 10.0 the cell becomes a solid column)
floor_height = 10.0

wall_texture = "brick_wall"
face_textures = ["brick_wall", "brick_wall", "brick_wall", "brick_wall"]
